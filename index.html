<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Merry Christmas ✦</title>
  <meta name="description" content="A little Christmas card: a glowing tree, falling snow and a wish for someone you love. Make your own and send it.">
  <meta name="theme-color" content="#060b1d">
  <meta property="og:title" content="Merry Christmas ✦">
  <meta property="og:description" content="A glowing tree, falling snow and a wish — just for you.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfdcf5"/><stop offset="1" stop-color="#8fa4cf"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#b9c8e8"/></linearGradient>
    </defs>
    <path d="M0 170 C 220 90 420 150 620 120 S 1020 60 1200 110 S 1380 120 1440 100 V320 H0Z" fill="url(#h1)" opacity=".55"/>
    <g class="village">
      <g transform="translate(250 112)"><path d="M0 30 L22 8 L44 30 V58 H0Z" fill="#26324f"/><path d="M-4 32 L22 4 L48 32" fill="none" stroke="#eef3ff" stroke-width="5"/><rect x="15" y="36" width="12" height="12" rx="2" class="win"/></g>
      <g transform="translate(330 128)"><path d="M0 22 L16 6 L32 22 V44 H0Z" fill="#1f2a45"/><path d="M-3 24 L16 2 L35 24" fill="none" stroke="#eef3ff" stroke-width="4"/><rect x="11" y="28" width="9" height="9" rx="2" class="win w2"/></g>
      <g transform="translate(1080 82)"><path d="M0 34 L26 8 L52 34 V66 H0Z" fill="#26324f"/><path d="M-4 36 L26 3 L56 36" fill="none" stroke="#eef3ff" stroke-width="5"/><rect x="10" y="40" width="12" height="12" rx="2" class="win w3"/><rect x="30" y="40" width="12" height="12" rx="2" class="win"/><rect x="36" y="2" width="8" height="18" fill="#26324f"/></g>
    </g>
    <path d="M0 230 C 260 170 520 220 760 200 S 1180 160 1440 210 V320 H0Z" fill="url(#h2)"/>
  </svg>

  <main class="card">
    <p class="dear" id="dear" hidden></p>
    <h1 class="title"><span class="t1">Merry</span> <span class="t2">Christmas</span></h1>
    <p class="wish" id="wish"></p>
    <p class="chip" id="chip"></p>
    <div class="actions">
      <button class="btn primary" id="wish-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.9H22l-6 4.6 2.3 7.1L12 16.3l-6.3 4.3L8 13.5 2 8.9h7.6z"/></svg>
        Make a wish
      </button>
      <button class="btn ghost" id="card-btn">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        Send a card
      </button>
    </div>
    <p class="from" id="from" hidden></p>
  </main>

  <dialog id="maker" aria-labelledby="maker-title">
    <form method="dialog" id="maker-form">
      <h2 id="maker-title">Send a Christmas card</h2>
      <p class="sub">They’ll open this page with their name on it.</p>
      <label>To <input id="to-in" maxlength="40" placeholder="Their name" autocomplete="off" required></label>
      <label>From <input id="from-in" maxlength="40" placeholder="Your name" autocomplete="off"></label>
      <label>A line from you<input id="msg-in" maxlength="90" placeholder="Optional — e.g. Hope this year was kind to you" autocomplete="off"></label>
      <div class="row">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary" id="make-btn">Copy link</button>
      </div>
    </form>
  </dialog>

  <footer class="foot">tap the tree ✦ made with care by <a href="https://www.tungdadev.com/">TungDaDev</a></footer>
  <div class="toast" id="toast" role="status"></div>
  <script src="script.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ec756d53737f4d2fbe45fbadcbeea044"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
